name: Release

on:
  push:
    # Semver tags only. The floating "v1" tag that the GitHub Action is
    # referenced by is moved on every release, and must not trigger a build or
    # publish a duplicate release of its own.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"

      - name: Test before releasing
        run: go test ./...

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Static, dependency-free binaries: the tool is most useful to people
          # who will not want to install a toolchain to get it.
          for target in \
              linux/amd64 linux/arm64 \
              darwin/amd64 darwin/arm64 \
              windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/egglint_${os}_${arch}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            echo "building $out$ext"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${out}${ext}" ./cmd/egglint
          done
          cd dist
          sha256sum * > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
